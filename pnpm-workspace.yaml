# Real workspace declaration. `packages` also keeps pnpm <= 10.9 from erroring
# with "packages field missing or empty" (fixed in 10.10+, but harmless).
#
# Workers Builds does NOT honor `packageManager` (its pnpm default is 10.11.1);
# each Workers project sets PNPM_VERSION=11.5.2 as a build variable instead.
# See .scratch/design-sites and the research/workers-builds-monorepo branch.
packages:
  - apps/*
  - packages/*

# Build-script approval, spelled both ways:
#   onlyBuiltDependencies  pnpm <= 10.25 (Workers Builds default is 10.11.1)
#   allowBuilds            pnpm >= 10.26 and pnpm 11+ (v11 removed the old key)
# Each version ignores the other's key. Without an approval, workerd's
# postinstall stays blocked and `pnpm install` exits 1.
onlyBuiltDependencies:
  - esbuild
  - sharp
  - workerd

allowBuilds:
  esbuild: true
  sharp: true
  workerd: true

# pnpm 11 defaults minimumReleaseAge to 1440; allow the pinned miniflare alpha.
minimumReleaseAgeExclude:
  - miniflare@5.20260804.1-alpha
